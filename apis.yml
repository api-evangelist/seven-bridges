apis:
- name: Seven Bridges Platform API
  description: >-
    Public REST API for the Seven Bridges Platform. Covers projects and project membership, files,
    folders, file metadata and tags, multipart upload, cloud storage volumes (AWS S3, Google Cloud
    Storage, Azure, OSS) with import and export jobs, CWL/Nextflow apps and app revisions, draft and
    batch task creation, execution, abort and rerun, billing groups, invoices and analysis/storage/egress
    cost breakdowns, rate limit status and advanced file search. JSON over HTTPS, authenticated with the
    X-SBG-Auth-Token header. Deployed on AWS US (api.sbgenomics.com) and AWS EU (eu-api.sbgenomics.com).
  humanURL: https://docs.sevenbridges.com/reference/the-api
  baseURL: https://api.sbgenomics.com/v2
