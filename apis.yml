aid: seven-bridges
name: Seven Bridges
description: >-
  Seven Bridges (a Velsera company) is a biomedical data analysis company whose cloud platform lets
  research organizations store, organize and analyze genomic and multi-omic data at scale. The Seven
  Bridges Platform exposes a public REST API at api.sbgenomics.com/v2 (AWS US) and eu-api.sbgenomics.com/v2
  (AWS EU) covering projects, members and permissions, files and folders, file metadata and tags,
  multipart uploads, cloud storage volumes with import/export jobs, CWL and Nextflow apps and their
  revisions, task creation/execution/batching, billing groups, invoices and cost breakdowns, plus rate
  limit and advanced file search. The same API powers two NIH/NCI-funded deployments Seven Bridges
  operates - the Cancer Genomics Cloud (cgc-api.sbgenomics.com) and CAVATICA (cavatica-api.sbgenomics.com).
  Authentication is a per-user X-SBG-Auth-Token header, first-party Python and R client libraries and an
  `sb` command line interface are published, and the API is documented on a ReadMe developer hub that
  also serves an llms.txt index.
