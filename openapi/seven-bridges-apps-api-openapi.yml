  /apps/{app_id}/actions/sync:
    post:
      summary: Synchronize a copied app with its parent app
      description: This call synchronizes a copied app with the source app from which it has been copied. For example, when **FASTQC** is copied from public apps to a project and updates are made to **FASTQC** in the public apps gallery (there are new revisions), this action fetches all revisions and revision notes from the updated parent app and applies them to your copied app. Once this has been done, the copied app is updated to the latest revision and includes the complete revision history of its parent app, following the logic of the `git pull` command.
      operationId: synchronize-a-copied-app-with-its-parent-app
      parameters:
      - name: X-SBG-Auth-Token
        in: header
        description: Your Seven Bridges Platform [authentication token](doc:get-your-authentication-token).
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Selector specifying a subset of fields to include in the response.
        schema:
          type: array
          items:
            type: string
      - name: app_id
        in: path
        description: The ID of the app you want to update. It should reference the project owner, the project that your app is copied to, and the app's short name (containing no non-alphanumeric characters or spaces).
        schema:
          type: string
        required: true
      responses:
