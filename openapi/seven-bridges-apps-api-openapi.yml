  /apps/{project_owner}/{project}/{app_short_name}/actions/copy:
    post:
      summary: Copy an app
      description: This call copies the specified app to the specified project. The app should be one in a project that you can access; this could be an app that has been uploaded to the Seven Bridges Platform by a project member, or a publicly available app that has been copied to the project.
      operationId: copy-an-app
      parameters:
      - name: X-SBG-Auth-Token
        in: header
        description: Your Seven Bridges Platform [authentication token](doc:get-your-authentication-token).
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Selector specifying a subset of fields to include in the response.
        schema:
          type: array
          items:
            type: string
      - name: project_owner
        in: path
        description: If you are using [Enterprise](doc:about-the-enterprise-feature), use the name of the Division that owns the project in which the app is located; otherwise, enter the Platform username of the project owner.
        schema:
          type: string
        required: true
      - name: project
        in: path
        description: The name of the project in which the app is located.
        schema:
          type: string
        required: true
      - name: app_short_name
        in: path
        description: The short name of the app you are copying. Optionally, to copy a specific revision of the app, use the `{app_short_name}/{revision_number}` format, for example `rfranklin/my-project/bamtools-index-2-4-0/1`
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - project
              properties:
                project:
                  type: string
                  description: The name of the project you want to copy the app to.
                name:
                  type: string
                  description: The new name the app will have in the target project. If its name will not change, omit this key.
                strategy:
                  type: string
                  description: 'The method for copying the app   `clone` : copy all revisions; get updates from the same app as the copied app (default) `direct`: copy latest revision; get updates from the copied app `clone_direct`: copy all revisions; get updates from the copied app `transient`: copy latest revision; get updates from the same app as the copied app'
                  default: clone
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "from sevenbridges import Api, AppCopyStrategy\n\napi = Api(url='https://api.sbgenomics.com/v2',\n          token='3210a98c1db9318fa9d9273156740f74')\n\napp = api.apps.get(id='RFranklin/my-project/bamtools-merge-2-4/0')\n\n# send POST request to SB API\nnew_app = app.copy(\n    project='rfranklin/my-project',\n    name='new app name',\n    strategy=AppCopyStrategy.DIRECT\n)\n\nprint(new_app.name, new_app.id)"
        samples-languages:
        - python
      tags:
      - Apps
  /apps/{app_id}/{revision_number}/raw:
    post:
      summary: Add an app revision using raw CWL
      description: This call creates a new revision for an existing app. It adds a new CWL app description, and stores it as the named revision for the specified app. The revision number must not already exist and should follow the sequence of previously created revisions.
      operationId: add-an-app-revision-using-raw-cwl
      parameters:
      - name: X-SBG-Auth-Token
        in: header
        description: Your Seven Bridges Platform [authentication token](doc:get-your-authentication-token).
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Selector specifying a subset of fields to include in the response.
        schema:
          type: array
          items:
            type: string
      - name: app_id
        in: path
        description: The ID for the app you are you want to upload. It should reference the project that you want the app to be added to, a short name for the app (containing no non-alphanumeric characters or spaces), and a revision number.
        schema:
          type: string
        required: true
      - name: Content-Type
        in: header
        description: 'Depending on the type of file you are uploading: * `application/json` for a JSON file * `application/yaml` for a YAML file'
        schema:
          type: string
      - name: revision_number
        in: path
        description: The number of the app revision you want to addd.
        schema:
          type: integer
          format: int32
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  description: The body of the request should be a CWL app description, saved as a JSON file. For a template of this description, try making the call to [get raw app information](ref:get-raw-cwl-for-an-app) about an app already in one of your projects.
                  format: json
      deprecated: false
      x-readme:
        code-samples:
        - language: python
          code: "from sevenbridges import Api\n\napi = Api(url='https://api.sbgenomics.com/v2',\n          token='3210a98c1db9318fa9d9273156740f74')\n\n# send POST request to SB API\nnew_app_revision = api.apps.create_revision(\n    id='RFranklin/my-project/my-app',\n    revision=4,\n    raw='... CWL JSON/YAML HERE ...'\n)\n\nprint(new_app_revision.name, new_app_revision.id, new_app_revision.revision)"
        samples-languages:
        - python
      tags:
      - Apps
