  /storage/imports:
    post:
      summary: Start an import job
      description: 'This call lets you queue a job to import a file or folder from a volume into a project on the Platform. Essentially, you are importing an item from your cloud storage provider (Amazon Web Services or Google Cloud Storage) via the volume onto the Platform.


        If successful, an alias will be created on the Platform. Aliases appear on the Platform and can be copied, executed, and modified as such. They refer back to the respective item on the given volume.


        If you want to import multiple files, the recommended way is to do it in bulk considering the API rate limit ([learn more](doc:api-rate-limit)).


        Learn more about using the Volumes API for [Amazon S3](doc:aws-cloud-storage-tutorial) and for [Google Cloud Storage](doc:google-cloud-storage-tutorial).'
      operationId: start-an-import-job-v2
      parameters:
      - name: X-SBG-Auth-Token
        in: header
        description: Your Seven Bridges Platform [authentication token](doc:get-your-authentication-token). For security reasons, token will not be automatically populated in the generated code sample. Please replace `<your-token-here>` with your token before executing this call.
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        schema:
          type: string
          default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              - destination
              properties:
                source:
                  type: object
                  description: This object should describe the source from which the item should be imported.
                  required:
                  - volume
                  - location
                  properties:
                    volume:
                      type: string
                      description: Volume ID from which to import the item.
                    location:
                      type: string
                      description: Volume-specific location pointing to the file or folder to import. This location should be recognizable to the underlying cloud service as a valid key or path to the item. If the item being imported is a folder, its path should end with a `/`.  Please note that if this volume was configured with a `prefix` parameter when it was created, the value of prefix will be prepended to location before attempting to locate the item on the volume.
                destination:
                  type: object
                  description: This object should describe the Platform destination for the imported file or folder.
                  properties:
                    project:
                      type: string
                      description: The project in which to create the alias.
                    parent:
                      type: string
                      description: The ID of the target folder to which the item should be imported.  Should not be used together with `project`. If `parent` is used, the import will take place into the specified folder, within the project to which the folder belongs. If `project` is used, the items will be imported to the root of the project's files.
                    name:
                      type: string
                      description: The name of the alias to create. This name should be unique to the project. If the name is already in use in the project, you should use the `overwrite` query parameter in this call to force any item with that name to be deleted before the alias is created.  If `name` is omitted, the alias name will default to the last segment of the complete location (including the `prefix`) on the volume. Segments are considered to be separated with forward slashes `/`.  Allowed characters in file names are all alphanumerics and special characters except forward slash `/`, while folder names can contain alphanumerics and special characters `_`, `-` and `.`.
                overwrite:
                  type: boolean
                  description: Whether to overwrite the item if another one with the same name already exists at the destination.
                autorename:
                  type: boolean
                  description: Whether to automatically rename the item (by prefixing its name with an underscore and number) if another one with the same name already exists at the destination.
                preserve_folder_structure:
                  type: boolean
                  description: Whether to keep the exact source folder structure. The default value is `true` if the item being imported is a folder. Should not be used if you are importing a file.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                File import:
                  value: "{\n  \"href\":\"https://api.sbgenomics.com/v2/storage/imports/Yrand0mERJY4F3grand0mzh5UuTdw2Ap\",\n  \"id\":\"Yrand0mERJY4F3grand0mzh5UuTdw2Ap\",\n  \"state\":\"COMPLETED\",\n  \"overwrite\":false,\n  \"autorename\":false,\n  \"source\":{\n    \"volume\":\"rfranklin/my_volume\",\n    \"location\":\"my-samples/november/sample1.bam\"\n  },\n  \"destination\":{\n    \"project\":\"rfranklin/my-project\",\n    \"name\":\"sample1.bam\",\n    \"parent\":\"5babc233e4b0cb3d7a82e7cc\"\n  },\n  \"result\":{\n    \"href\":\"https://api.sbgenomics.com/v2/files/567890abc1e5339df0414123\",\n    \"id\":\"567890abc1e5339df0414123\",\n    \"name\":\"sample1.bam\",\n    \"size\":1804,\n    \"project\":\"rfranklin/my-project\",\n    \"created_on\":\"2018-10-22T12:25:53Z\",\n    \"modified_on\":\"2018-10-22T12:25:53Z\",\n    \"storage\":{\n      \"type\":\"VOLUME\",\n      \"volume\":\"rfranklin/my_volume\",\n      \"location\":\"my-samples/november/sample1.bam\"\n    },\n    \"origin\":{\n      \n    },\n    \"tags\":[\n      \n    ],\n    \"metadata\":{\n      \n    }\n  },\n  \"started_on\":\"2018-10-22T12:25:53Z\",\n  \"finished_on\":\"2018-10-22T12:25:54Z\"\n}"
                Folder import:
