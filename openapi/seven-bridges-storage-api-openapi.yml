        schema:
          type: string
      - name: Content-Type
        in: header
        schema:
          type: string
          default: application/json
      - name: volume_owner_username
        in: path
        description: The username of the volume owner.
        schema:
          type: string
        required: true
      - name: force
        in: query
        description: Set this to `true` to force-quit ongoing import or export operations on a volume you intend to deactivate
        schema:
          type: boolean
      - name: volume_name
        in: path
        description: The name of the volume you want to deactivate.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
