  /storage/exports:
    post:
      summary: Start an export job
      description: 'This call lets you queue a job to export a file from a project on the Platform into a volume. The file selected for export must not be a public file or an alias. Aliases are objects stored in your cloud storage bucket which have been made available on the Platform. The volume you are exporting to must be configured for read-write access. To do this, set the `access_mode` parameter to `RW` when [creating](doc:create-a-volume-v2) or [modifying](doc:update-a-volume-v2) a volume.


        Essentially, the call writes to your cloud storage bucket via the volume. If this call is successful, the original project file will become an alias to the newly exported object on the volume. The source file will be deleted from the Platform and, if no more copies of this file exist, it will no longer count towards your total storage price on the Platform. In summary, once you export a file from the Platform to a volume, it is no longer part of the storage on the Platform and cannot be exported again.


        If you want to export multiple files, the recommended way is to do it in bulk considering the API rate limit ([learn more](doc:api-rate-limit)).


        Learn more about using the Volumes API for [Amazon S3](doc:aws-cloud-storage-tutorial).'
      operationId: start-an-export-job-v2
      parameters:
      - name: copy_only
        in: query
        description: If `true`, file will be copied to a volume but source file will remain on the Platform.
        schema:
          type: boolean
      - name: X-SBG-Auth-Token
        in: header
        description: Your Seven Bridges Platform [authentication token](doc:get-your-authentication-token). For security reasons, token will not be automatically populated in the generated code sample. Please replace `<your-token-here>` with your token before executing this call.
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        schema:
          type: string
          default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              - destination
              properties:
                source:
                  type: object
                  description: This object should describe the source from which the file should be exported.
                  required:
                  - file
                  properties:
                    file:
                      type: string
                      description: The ID of the file for export.
                destination:
                  type: object
                  description: This object should describe the destination to which the file will be exported.
                  required:
                  - volume
                  - location
                  properties:
                    volume:
                      type: string
                      description: The ID of the volume to which the file will be exported. The ID must be in the `{volume_owner_username}/{volume_name}` format.
                    location:
                      type: string
                      description: Volume-specific location to which the file will be exported. This location should be recognizable to the underlying cloud service as a valid key or path to a new file.  Please note that if this volume has been configured with a `prefix` parameter, the value of `prefix` will be prepended to `location` before attempting to create the file on the volume.
                overwrite:
                  type: boolean
                  description: 'If true and a file exists in the given location on the volume (respecting volume prefix if given), the API will attempt to delete the existing file on the volume before exporting.  _default_: `false`'
                properties:
